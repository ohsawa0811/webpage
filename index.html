<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFRAMEコンテンツ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: #2a2a32;
    --accent: #b8ff57;
    --accent-dim: rgba(184,255,87,0.12);
    --text: #e8e8ec;
    --muted: #6b6b7a;
    --danger: #ff5f5f;
    --info: #57b8ff;
  }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 24px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .dot-group { display: flex; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }

  .header-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: 6px;
    letter-spacing: 0.08em;
  }

  .badge {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(184,255,87,0.3);
    letter-spacing: 0.05em;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }
  .card:nth-child(2) { animation-delay: 0.05s; }
  .card:nth-child(3) { animation-delay: 0.10s; }
  .card:nth-child(4) { animation-delay: 0.15s; }
  .card:nth-child(5) { animation-delay: 0.20s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(184,255,87,0.25);
    border-radius: 4px;
    padding: 1px 6px;
  }

  .card-header h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .card-body { padding: 18px 16px; }

  /* ===== URL Parameter Section ===== */
  .param-url-box {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: #0a0a0c;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--muted);
    word-break: break-all;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .param-url-box .url-label {
    color: #444;
    margin-right: 6px;
  }
  .param-url-box .url-text {
    color: var(--info);
  }

  .param-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .param-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .param-row.has-value {
    border-color: rgba(184,255,87,0.35);
  }
  .param-row.no-value {
    border-color: rgba(107,107,122,0.3);
    opacity: 0.6;
  }

  .param-key {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 10px 14px;
    min-width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
    letter-spacing: 0.05em;
  }
  .param-row.no-value .param-key {
    color: var(--muted);
    background: rgba(107,107,122,0.08);
  }

  .param-value {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    padding: 10px 14px;
    flex: 1;
    display: flex;
    align-items: center;
    word-break: break-all;
  }
  .param-value.empty {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }

  .param-badge-none {
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    padding: 2px 6px;
    border-radius: 3px;
    background: rgba(107,107,122,0.15);
    color: var(--muted);
    border: 1px solid rgba(107,107,122,0.2);
    margin-left: auto;
    margin-right: 10px;
    white-space: nowrap;
    align-self: center;
  }

  /* JS Section */
  .counter-display {
    font-family: 'DM Mono', monospace;
    font-size: 56px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 16px;
    transition: transform 0.1s ease;
  }
  .counter-display.bump { transform: scale(1.08); }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    letter-spacing: 0.03em;
  }
  .btn:hover { background: rgba(255,255,255,0.06); border-color: #444; }
  .btn.primary {
    background: var(--accent);
    color: #0d0d0f;
    border-color: var(--accent);
    font-weight: 500;
  }
  .btn.primary:hover { background: #caff6e; border-color: #caff6e; }
  .btn.danger { color: var(--danger); border-color: rgba(255,95,95,0.3); }
  .btn.danger:hover { background: rgba(255,95,95,0.08); border-color: var(--danger); }

  .log-box {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: #0a0a0c;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--accent);
    height: 80px;
    overflow-y: auto;
    line-height: 1.6;
  }
  .log-line { color: var(--muted); }
  .log-line .ts { color: #444; margin-right: 6px; }
  .log-line .msg { color: var(--accent); }

  /* Link section */
  .link-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: #0a0a0c;
    border: 1px solid var(--border);
    border-radius: 8px;
    text-decoration: none;
    transition: border-color 0.2s, background 0.2s;
    color: var(--text);
  }
  .link-card:hover { border-color: var(--info); background: rgba(87,184,255,0.05); }
  .link-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .link-icon.google { background: rgba(66,133,244,0.15); }
  .link-meta { flex: 1; }
  .link-meta .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .link-meta .url { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
  .link-arrow { font-size: 16px; color: var(--muted); transition: color 0.2s, transform 0.2s; }
  .link-card:hover .link-arrow { color: var(--info); transform: translate(2px,-2px); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="wrapper">

  <div class="header">
    <div class="dot-group">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
    </div>
    <span class="header-title">iframe_content.html</span>
    <span class="badge">IFRAME内</span>
  </div>

  <!-- ① URLパラメータ表示 -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">01</span>
      <h3>URL パラメータ</h3>
    </div>
    <div class="card-body">
      <div class="param-url-box">
        <span class="url-label">URL:</span>
        <span class="url-text" id="current-url">—</span>
      </div>
      <div class="param-grid" id="param-grid">
        <!-- JSで生成 -->
      </div>
    </div>
  </div>

  <!-- ② JavaScript動作確認 -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">02</span>
      <h3>JavaScript 動作確認</h3>
    </div>
    <div class="card-body">
      <div class="counter-display" id="counter">00</div>
      <div class="btn-row">
        <button class="btn primary" onclick="countUp()">＋ カウントアップ</button>
        <button class="btn" onclick="countDown()">－ カウントダウン</button>
        <button class="btn danger" onclick="resetCount()">リセット</button>
        <button class="btn" onclick="showTime()">現在時刻</button>
      </div>
      <div class="log-box" id="logbox">
        <div class="log-line"><span class="ts">--:--:--</span><span class="msg">準備完了。ボタンを押してください。</span></div>
      </div>
    </div>
  </div>

  <!-- ③ IFRAMEの中のGoogleへのリンク -->
  <div class="card">
    <div class="card-header">
      <span class="section-num">03</span>
      <h3>IFRAME内 → Google へのリンク</h3>
    </div>
    <div class="card-body">
      <a class="link-card" href="https://www.google.com" target="_blank" rel="noopener">
        <div class="link-icon google">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </div>
        <div class="link-meta">
          <div class="title">Google</div>
          <div class="url">https://www.google.com</div>
        </div>
        <span class="link-arrow">↗</span>
      </a>
    </div>
  </div>

</div><!-- /wrapper -->

<script>
  // ===== URLパラメータ読み取り =====
  (function () {
    const params = new URLSearchParams(window.location.search);
    const keys = ['p1', 'p2', 'p3'];

    // 現在のURLを表示（クォートを除去して表示）
    document.getElementById('current-url').textContent = window.location.href;

    const grid = document.getElementById('param-grid');

    keys.forEach(function (key) {
      // URLSearchParams はクォート文字もそのまま返すので除去する
      let raw = params.get(key);
      let value = null;
      if (raw !== null) {
        // 前後の " や ' を取り除く
        value = raw.replace(/^["']|["']$/g, '').trim();
      }

      const row = document.createElement('div');
      row.className = 'param-row ' + (value !== null ? 'has-value' : 'no-value');

      const keyEl = document.createElement('div');
      keyEl.className = 'param-key';
      keyEl.textContent = key;

      const valEl = document.createElement('div');
      valEl.className = 'param-value' + (value !== null ? '' : ' empty');
      valEl.textContent = value !== null ? value : '（未指定）';

      row.appendChild(keyEl);
      row.appendChild(valEl);

      if (value === null) {
        const badge = document.createElement('span');
        badge.className = 'param-badge-none';
        badge.textContent = 'null';
        row.appendChild(badge);
      }

      grid.appendChild(row);
    });
  })();

  // ===== カウンター =====
  let count = 0;

  function pad(n) { return String(n).padStart(2, '0'); }

  function ts() {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function log(msg) {
    const box = document.getElementById('logbox');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="ts">${ts()}</span><span class="msg">${msg}</span>`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function updateDisplay() {
    const el = document.getElementById('counter');
    el.textContent = pad(Math.abs(count));
    el.style.color = count < 0 ? '#ff5f5f' : '#b8ff57';
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 100);
  }

  function countUp()    { count++; updateDisplay(); log(`カウントアップ → ${count}`); }
  function countDown()  { count--; updateDisplay(); log(`カウントダウン → ${count}`); }
  function resetCount() { count = 0; updateDisplay(); log('リセットしました'); }
  function showTime()   { log(`現在時刻: ${ts()}`); }
</script>
</body>
</html>
